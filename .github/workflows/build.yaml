name: Build release

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.id }}
  cancel-in-progress: false

env:
  ANDROID_NDK_VERSION: 28.2.13676358
  VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        shell: bash
        run: |
          # API 37 ships as platforms;android-37.0 (directory android-37.0).
          # AGP still looks for platforms/android-37 when compileSdk = 37.
          sdkmanager \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;3.22.1"
          ln -sfn android-37.0 "${ANDROID_SDK_ROOT}/platforms/android-37"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install native build deps
        shell: bash
        run: |
          # libusb (via vcpkg-make) needs host autotools on the runner.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf \
            autoconf-archive \
            automake \
            libtool \
            pkg-config \
            ninja-build

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-ndk-${{ env.ANDROID_NDK_VERSION }}-${{ hashFiles('app/src/main/cpp/vcpkg.json', 'app/src/main/cpp/vcpkg-configuration.json', 'app/src/main/cpp/overlay-ports/**') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-ndk-${{ env.ANDROID_NDK_VERSION }}-

      - name: Set up vcpkg
        shell: bash
        run: |
          baseline="$(jq -r '."default-registry".baseline' app/src/main/cpp/vcpkg-configuration.json)"
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout "$baseline"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Read version from release tag
        shell: bash
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like v1.2 or v1.2.3: $TAG_NAME" >&2
            exit 1
          fi
          echo "ORG_GRADLE_PROJECT_releaseVersionName=$version" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_releaseVersionCode=$((10000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Configure release signing
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          for value in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [[ -z "${!value}" ]]; then
              echo "Missing GitHub Actions secret: $value" >&2
              exit 1
            fi
          done
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release.jks
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$GITHUB_WORKSPACE/release.jks" \
            "$RELEASE_STORE_PASSWORD" \
            "$RELEASE_KEY_ALIAS" \
            "$RELEASE_KEY_PASSWORD" > keystore.properties

      - name: Build release APK
        shell: bash
        run: ./scripts/build-release.sh --out dist

      - name: Upload APK to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG_NAME" dist/*.apk --clobber
